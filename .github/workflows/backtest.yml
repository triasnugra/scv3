name: Backtest

# Mingguan (atau manual): uji ulang strategi pada data nyata terbaru dan simpan hasilnya ke state/backtest.json.
# Dashboard memuat hasilnya pada scan berikutnya (maks. 15 menit).
on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "Jumlah hari ke belakang"
        default: "45"

permissions:
  contents: write

concurrency:
  group: scalp-engine
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt || pip install -r requirements-core.txt
      - name: Jalankan backtest
        run: python -m scalp backtest --days "${{ inputs.days || '45' }}"
      - name: Simpan hasil
        run: |
          git config user.name "scalp-bot"
          git config user.email "scalp-bot@users.noreply.github.com"
          git add state/backtest.json
          if git diff --cached --quiet; then echo "tidak ada perubahan"; else
            git commit -m "chore(backtest): update $(date -u +%F) [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
