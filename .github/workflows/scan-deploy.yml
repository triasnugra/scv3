name: Scan & Deploy

# Tiap 15 menit: unduh data -> analisis -> perbarui sinyal -> simpan state -> publish dashboard ke GitHub Pages.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      demo:
        description: "Mode demo (data sintetis, tidak menyentuh state/)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ["state/**", "**.md"]

permissions:
  contents: write
  pages: write
  id-token: write

# satu proses pada satu waktu supaya state tidak bentrok
concurrency:
  group: scalp-engine
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      STATE_DIR: ${{ inputs.demo && format('{0}/state_demo', runner.temp) || 'state' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Pasang dependensi
        run: pip install -r requirements.txt || pip install -r requirements-core.txt
      - name: Scan pasar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m scalp --state-dir "$STATE_DIR" scan ${{ inputs.demo && '--demo' || '' }}
      - name: Rakit situs
        run: python -m scalp --state-dir "$STATE_DIR" build-site --out public
      - name: Simpan state ke repo
        if: ${{ !inputs.demo }}
        run: |
          git config user.name "scalp-bot"
          git config user.email "scalp-bot@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "state tidak berubah"
          else
            git commit -m "chore(state): update $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
