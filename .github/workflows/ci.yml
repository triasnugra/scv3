name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["state/**", "**.md"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Pasang dependensi
        run: pip install -r requirements-dev.txt || (pip install -r requirements-core.txt pytest)
      - name: Tes
        run: python -m pytest -q
      - name: Asap demo (data sintetis, tanpa internet)
        run: python -m scalp --state-dir "$RUNNER_TEMP/state" demo --out "$RUNNER_TEMP/public"
